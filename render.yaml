databases:
  - name: mercado-express-db
    databaseName: mercado_express
    user: mercado
    plan: free

services:
  - type: web
    name: mercado-express-security
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: mercado-express-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mercado-express-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: mercado-express-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: mercado-express-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mercado-express-db
          property: password
      - key: ADMIN_EMAIL
        value: admin@mercadoexpress.com
      - key: ADMIN_SENHA
        sync: false
