server:
  port: ${PORT:8080}

spring:
  application:
    name: mercado-express-security

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mercado_express}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update        # cria/atualiza as tabelas automaticamente
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

# Usuarios criados automaticamente na primeira execucao
app:
  admin:
    nome: ${ADMIN_NOME:Gerente Mercado Express}
    email: ${ADMIN_EMAIL:admin@mercadoexpress.com}
    senha: ${ADMIN_SENHA:admin123}
  demo:
    criar-cliente: ${DEMO_CLIENTE:true}
    email: cliente@mercadoexpress.com
    senha: cliente123

logging:
  level:
    br.com.fiap.mercadoexpress: INFO
