<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Produto')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container">
    <div class="page-header">
        <div>
            <h1 th:text="${produto.id == null} ? 'Cadastrar produto' : 'Editar ' + ${produto.nome}">Cadastrar produto</h1>
            <p th:text="${produto.id == null} ? 'O produto aparece no catálogo assim que for salvo.' : 'As alterações valem imediatamente para todos os clientes.'">.</p>
        </div>
    </div>

    <section class="painel">
        <form th:object="${produto}" method="post" novalidate
              th:action="${produto.id == null} ? @{/produtos/novo} : @{/produtos/{id}/editar(id=${produto.id})}">

            <div class="alerta-msg alerta-erro" th:if="${#fields.hasAnyErrors()}">
                Corrija os campos destacados para salvar.
            </div>

            <div class="form-grid">
                <div class="campo campo-inteiro" th:classappend="${#fields.hasErrors('nome')} ? 'campo-erro'">
                    <label for="nome">Nome do produto</label>
                    <input type="text" id="nome" th:field="*{nome}" maxlength="100" required>
                    <span class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                </div>

                <div class="campo" th:classappend="${#fields.hasErrors('categoria')} ? 'campo-erro'">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" th:field="*{categoria}" required>
                        <option value="">Selecione</option>
                        <option th:each="c : ${categorias}" th:value="${c}" th:text="${c.descricao}">Categoria</option>
                    </select>
                    <span class="erro-campo" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></span>
                </div>

                <div class="campo" th:classappend="${#fields.hasErrors('unidade')} ? 'campo-erro'">
                    <label for="unidade">Unidade de venda</label>
                    <input type="text" id="unidade" th:field="*{unidade}" list="unidades" required>
                    <datalist id="unidades">
                        <option value="un"></option><option value="kg"></option><option value="pacote"></option>
                        <option value="caixa"></option><option value="garrafa"></option><option value="bandeja"></option>
                    </datalist>
                    <span class="erro-campo" th:if="${#fields.hasErrors('unidade')}" th:errors="*{unidade}"></span>
                </div>

                <div class="campo" th:classappend="${#fields.hasErrors('precoCusto')} ? 'campo-erro'">
                    <label for="precoCusto">Preço de custo (R$)</label>
                    <input type="number" id="precoCusto" th:field="*{precoCusto}" step="0.01" min="0.01" required>
                    <span class="erro-campo" th:if="${#fields.hasErrors('precoCusto')}" th:errors="*{precoCusto}"></span>
                </div>

                <div class="campo" th:classappend="${#fields.hasErrors('precoVenda')} ? 'campo-erro'">
                    <label for="precoVenda">Preço de venda (R$)</label>
                    <input type="number" id="precoVenda" th:field="*{precoVenda}" step="0.01" min="0.01" required>
                    <span class="erro-campo" th:if="${#fields.hasErrors('precoVenda')}" th:errors="*{precoVenda}"></span>
                </div>

                <div class="campo" th:classappend="${#fields.hasErrors('quantidadeEstoque')} ? 'campo-erro'">
                    <label for="quantidadeEstoque">Quantidade em estoque</label>
                    <input type="number" id="quantidadeEstoque" th:field="*{quantidadeEstoque}" step="1" min="0" required>
                    <span class="erro-campo" th:if="${#fields.hasErrors('quantidadeEstoque')}" th:errors="*{quantidadeEstoque}"></span>
                </div>

                <div class="campo campo-inteiro" th:classappend="${#fields.hasErrors('descricao')} ? 'campo-erro'">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" th:field="*{descricao}" maxlength="500"></textarea>
                    <span class="erro-campo" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></span>
                </div>

                <label class="checkbox campo-inteiro">
                    <input type="checkbox" th:field="*{ativo}"> Disponível para venda
                </label>
            </div>

            <div class="acoes mt">
                <button type="submit" class="btn btn-primary"
                        th:text="${produto.id == null} ? 'Cadastrar produto' : 'Salvar alterações'">Salvar</button>
                <a class="btn btn-ghost"
                   th:href="${produto.id == null} ? @{/produtos} : @{/produtos/{id}(id=${produto.id})}">Cancelar</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
